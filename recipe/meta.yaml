{% set name = "mkdocs-git-revision-date-localized-plugin" %}
{% set version = "1.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 469af4b344a4d493a6402aa92eec87a6138e1dac444e9551c1af06991453954b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - mkdocs <2,>=1.4
    - gitpython >=3.1.59
    - babel >=2.7.0
    # - pytz 
    # - pytz 
    # - GitPython 
    # - pytz 
    # - GitPython 
    # - pytz 
    # - markupsafe 
    # - GitPython 
    # - pytz 
    # - GitPython 
    # - pytz 
    # - GitPython 
    # - pytz 
    # - GitPython 
    # - pytz 
    # - GitPython 
    # - pytz 
    # - pytest-cov 
    # - pytest 
    # - mkdocs-static-i18n 
    # - mkdocs-material 
    # - mkdocs-git-authors-plugin 
    # - mkdocs-gen-files 
    # - codecov 
    # - click 
    # - GitPython 
    # - pytz 
    # - pytest-cov 
    # - pytest 
    # - mkdocs-static-i18n 
    # - mkdocs-material 
    # - mkdocs-git-authors-plugin 
    # - mkdocs-gen-files 
    # - codecov 
    # - click 
    # - GitPython 
    # - python-tzdata >=2023.3
    # - python-tzdata >=2023.3
    # - packaging >=20.0

test:
  imports:
    - mkdocs_git_revision_date_localized_plugin
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/timvink/mkdocs-git-revision-date-localized-plugin
  summary: MkDocs plugin that enables displaying the date of the last git modification of a page.
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cpcloud
    - jsmolic
