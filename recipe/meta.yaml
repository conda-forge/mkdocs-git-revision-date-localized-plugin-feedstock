{% set name = "mkdocs-git-revision-date-localized-plugin" %}
{% set version = "1.5.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 873444b54cab4d47c69bd6e85da05ef5fbe81fee27e64508114c46a0e4f81e37

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - mkdocs <2,>=1.0
    - gitpython >=3.1.44
    - babel >=2.7.0
    # - pytz 
    # - pytz 
    # - GitPython 
    # - pytz 
    # - GitPython 
    # - pytz 
    # - markupsafe 
    # - GitPython 
    # - pytz 
    # - GitPython 
    # - pytz 
    # - GitPython 
    # - pytz 
    # - GitPython 
    # - pytz 
    # - GitPython 
    # - pytz 
    # - pytest-cov 
    # - pytest 
    # - mkdocs-static-i18n 
    # - mkdocs-material 
    # - mkdocs-git-authors-plugin 
    # - mkdocs-gen-files 
    # - codecov 
    # - click 
    # - GitPython 
    # - pytz 
    # - pytest-cov 
    # - pytest 
    # - mkdocs-static-i18n 
    # - mkdocs-material 
    # - mkdocs-git-authors-plugin 
    # - mkdocs-gen-files 
    # - codecov 
    # - click 
    # - GitPython 
    # - python-tzdata >=2023.3

test:
  imports:
    - mkdocs_git_revision_date_localized_plugin
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/timvink/mkdocs-git-revision-date-localized-plugin
  summary: MkDocs plugin that enables displaying the date of the last git modification of a page.
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cpcloud
