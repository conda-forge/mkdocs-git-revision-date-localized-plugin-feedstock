{% set name = "mkdocs-git-revision-date-localized-plugin" %}
{% set version = "1.7.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 3e5963dce2e52c7ba3cb5de6e7a10d1f7836f275599df05b5ec2d587bed4e270

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - mkdocs <2,>=1.4
    - gitpython >=3.2.1
    - babel >=2.7.0
